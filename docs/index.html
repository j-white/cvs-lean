<style>
/* Layout: one full-bleed WebGL stage, the title at the top left, and the story card docked at the
   bottom centre. */
:root {
  color-scheme: dark;
  --bg: #0b0c14;
  --ink: #ece6dc;
  --ink-2: #bab2a8;
  --ink-3: #a29a90;
  --glass: rgba(15, 14, 22, 0.76);
  --glass-dim: brightness(0.55);
  --glass-edge: rgba(236, 230, 220, 0.13);
  --well: rgba(236, 230, 220, 0.06);
  --accent: #ffb35c;
  --crit: #ff6a5a;
  --shadow: rgba(0, 0, 0, 0.55);
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --f-ui: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage { position: fixed; inset: 0; background: var(--bg); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
/* The far wall's whole number, placed over its edge in the side view by the script. */
.wall-tag {
  position: fixed;
  left: 0;
  top: 0;
  font: 500 13px/1 var(--f-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
  pointer-events: none;
  will-change: transform;
}
@media (min-width: 900px) and (min-height: 501px) {
  .wall-tag { font-size: 15px; }
}

.titleblock {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(44ch, calc(100% - 32px));
  pointer-events: none;
  text-shadow: 0 1px 14px var(--shadow);
}
.eyebrow {
  margin: 0 0 8px;
  font: 500 11px/1 var(--f-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
h1 {
  margin: 0;
  font: italic 500 clamp(30px, 4.2vw, 48px)/0.95 var(--f-display);
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--well); border-radius: 9px; }
.seg button {
  display: block;
  padding: 7px 4px;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--ink-2);
  font: 500 12.5px/1.1 var(--f-ui);
  text-align: center;
  cursor: pointer;
}
.plucks button { display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--f-mono); }
.plucks button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, currentColor); }

.btn {
  padding: 9px 13px;
  border: 1px solid var(--glass-edge);
  border-radius: 8px;
  background: var(--well);
  color: var(--ink);
  font: 600 13px/1.15 var(--f-ui);
  text-wrap: balance;
  cursor: pointer;
}
.btn.primary { border-color: var(--accent); color: var(--accent); }

/* The story: one sentence at a time in a card at the bottom. */
.story {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  box-sizing: border-box;
  width: min(660px, calc(100% - 32px));
  display: grid;
  gap: 8px;
  padding: 16px 18px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 14px;
  -webkit-backdrop-filter: blur(16px) var(--glass-dim);
  backdrop-filter: blur(16px) var(--glass-dim);
}

.story-text { margin: 0; font: italic 400 clamp(20px, 2.1vw, 26px)/1.22 var(--f-display); text-wrap: balance; }

.story-sub a { color: var(--accent); white-space: nowrap; }

.story-plucks { margin-top: 2px; }
.btn:disabled { opacity: 0.4; cursor: default; }

  transform: translate(-50%, -50%);

  border: 1px solid var(--crit);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px;
}

  .story-text { font-size: 18px; }
  .story-sub { font-size: 12.5px; line-height: 1.3; }
  .story-live { font-size: 12px; line-height: 1.3; }
  .story-plucks button { padding: 5px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}

     Next waits, disabled, until the hallway is drawn. -->

  <p class="story-sub" id="story-sub">On this ruler, doubling always takes the same length of floor: 1 to 2, 2 to 4 and 4 to 8 are equally far apart.</p>
  <p class="story-live" id="story-live" hidden></p>
  <div class="seg plucks story-plucks" id="story-plucks" role="group" aria-label="Pluck a string" hidden>

    <button type="button" class="btn primary" id="story-next" disabled>Next</button>
  </div>
</section>

<script>
  // Tell the viewer plainly if the 3D library never arrives.
  setTimeout(function () {
    if (!window.__hallwayStarted) {
      var f = document.getElementById('fail');
      f.hidden = false;
      f.textContent = 'The 3D library did not load, so the hallway cannot be drawn. Check the connection and reload the page.';
      document.querySelector('.story-nav').hidden = true;
    }
  }, 15000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.__hallwayStarted = true;
const $ = (id) => document.getElementById(id);
const failBox = $('fail');
// The first failure is the one reported; the story cannot go on without the scene.
function fail(msg) {
  if (!failBox.hidden) return;
  failBox.hidden = false;
  failBox.textContent = msg;
  document.querySelector('.story-nav').hidden = true;
}
window.addEventListener('error', (e) => fail('The scene stopped: ' + (e.message || 'unknown error') + '. Reload the page to try again.'));
window.addEventListener('unhandledrejection', (e) => fail('The scene stopped: ' + ((e.reason && e.reason.message) || e.reason) + '. Reload the page to try again.'));

// ---------------------------------------------------------------------------------------------
// Mathematics. Everything the scene shows is computed here, never hand-placed.
// ---------------------------------------------------------------------------------------------

// Imaginary parts of the first 12 zeta zeros, one X-ray spring each; GAMMA1 is the first to full precision.
const ZEROS = [14.134725, 21.02204, 25.010858, 30.424876, 32.935062, 37.586178, 40.918719, 43.327073,
  48.005151, 49.773832, 52.970321, 56.446248];
const GAMMA1 = 14.134725141734694;

// One spring of the explicit formula: 8 Re[sin^2(zL/2) / z^2] with z = gamma - i a.
function springTerm(g, a, L) {
  const u = g * L / 2, v = a * L / 2;
  const sr = Math.sin(u) * Math.cosh(v), si = -Math.cos(u) * Math.sinh(v);
  const qr = sr * sr - si * si, qi = 2 * sr * si;
  const zr = g * g - a * a, zi = -2 * g * a;
  return 8 * (qr * zr + qi * zi) / (zr * zr + zi * zi);
}

const C_MAX = 3000;
const PRIMES = (() => {
  const n = C_MAX, sieve = new Uint8Array(n + 1), out = [];
  for (let i = 2; i <= n; i++) if (!sieve[i]) { out.push(i); for (let j = i * i; j <= n; j += i) sieve[j] = 1; }
  return out;
})();
const JEWEL = [2, 3, 5, 7, 11, 13];

// Box energy G(L), L = log c: 8 sin^2(gamma L / 2) / gamma^2 summed over the zeros, computed exactly on
// the prime side of Weil's explicit formula,
//   G = 8 sqrt(c) + A0 L + 2 C0 - 2 sum_k c^-(2k+1/2) / (2k+1/2)^2 - 2 sum_{n <= c} Lambda(n) / sqrt(n) (L - log n),
// with A0 = psi(1/4) - log(pi) and C0 = psi'(1/4)/4 - 8. Bending the first zero off the line by a moves it
// to 1/2 + a + i gamma and brings its mirror twin at 1/2 - a + i gamma; that pair replaces its spring.
const A0 = -5.3721834192256656, C0 = -3.7006677113732223;
const LAMBDA = new Float64Array(C_MAX + 1);
for (const p of PRIMES) for (let q = p; q <= C_MAX; q *= p) LAMBDA[q] = Math.log(p);
// The two sides of that balance: the footsteps' pull, 2 sum_{n <= c} Lambda(n) / sqrt(n) (L - log n), and
// the smooth lift, all the rest (the pole and Gamma-factor terms), which knows nothing about individual primes.
function boxParts(L) {
  const x = Math.exp(L);
  let s = 0, t = 0;
  for (let n = 2; n <= x; n++) if (LAMBDA[n]) s += LAMBDA[n] / Math.sqrt(n) * (L - Math.log(n));
  for (let k = 1; k <= 8; k++) { const e = 2 * k + 0.5; t += Math.exp(-e * L) / (e * e); }
  return { lift: 8 * Math.sqrt(x) + A0 * L + 2 * C0 - 2 * t, steps: 2 * s };
}
function boxEnergy(L, a) {
  const { lift, steps } = boxParts(L);
  const G = lift - steps;
  return a > 0 ? G - springTerm(GAMMA1, 0, L) + 2 * springTerm(GAMMA1, a, L) : G;
}

// World layout: x is the hallway coordinate u = log n, scaled by S; lanes run along x at fixed z.
const S = 5.2;
const Z_LANE0 = 1.6, DZ = 0.95, DZS = 0.62, Z_FRONT = 3.0;
const BEAT = 0.62;
const arcHeight = (stride) => 0.36 * Math.pow(stride, 0.55);
// The height no arc reaches in a hallway whose far wall stands at c: the top of the side view's picture.
const arcTop = (c) => arcHeight(S * Math.log(c)) + 0.2;
const threadRadius = (w, kind) => (kind === 'rain' ? 0.010 : 0.013) + 0.05 * w;
function hash01(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// The far wall's clock, for the steps where the wall moves: it runs on the walkers' beat. At every
// downbeat the wall rests on a whole number, and during the beat it moves to the next one with the
// walkers' own hop ease: out from 16 to 64 in 48 beats, a hold of 2 beats, back in 48, a hold of 2.
// T counts beats since the clock was set. The wall rests a hair past each whole number n, so the
// footprint at n is inside it (chainLength and buildModel count strictly before the far wall).
const WALL = { lo: 16, hi: 64, hold: 2 };
const WALL_SPAN = WALL.hi - WALL.lo;
const WALL_PERIOD = 2 * (WALL_SPAN + WALL.hold);
const WALL_EPS = 1e-9;
const wallAt = (n) => Math.exp(Math.log(n) + WALL_EPS);
function wallRise(u) {
  if (u <= 0) return Math.log(WALL.lo);
  if (u >= WALL_SPAN) return Math.log(WALL.hi);
  const n = WALL.lo + Math.floor(u), f = u - Math.floor(u);
  return Math.log(n) + Math.log((n + 1) / n) * f * f * (3 - 2 * f);
}
function wallL(T) {
  const t = ((T % WALL_PERIOD) + WALL_PERIOD) % WALL_PERIOD;
  const u = t < WALL_SPAN ? t : t < WALL_SPAN + WALL.hold ? WALL_SPAN
          : t < 2 * WALL_SPAN + WALL.hold ? 2 * WALL_SPAN + WALL.hold - t : 0;
  return wallRise(u) + WALL_EPS;
}
// Reduced motion steps the wall through fixed whole numbers instead, out and back.
const WALL_STOPS = [16, 20, 25, 32, 40, 50, 64];

// The path law: a walker with stride log q starting at the entrance leaves
// m = ceil(log c / log q) footprints before the far wall (chains of m or m - 1 from other starts).
// Each small prime sets off one beat after the one before it, so neighbouring lanes never walk in step.
function chainLength(L, stride) { return Math.floor(L / stride - 1e-12) + 1; }

function buildModel(c) {
  const L = Math.log(c), xEnd = S * L;
  const walkers = [];
  let silver = 0, rain = 0;
  for (const p of PRIMES) {
    if (p >= c) break;
    const lq = Math.log(p);
    const nb = chainLength(L, lq);
    const ji = JEWEL.indexOf(p);
    let kind, z = 0;
    if (ji >= 0) { kind = 'jewel'; z = Z_LANE0 - ji * DZ; }
    else if (nb >= 3) { kind = 'silver'; z = Z_LANE0 - 6 * DZ - silver * DZS; silver++; }
    else { kind = 'rain'; rain++; }
    const xs = [];
    for (let k = 0; k < nb; k++) xs.push(S * k * lq);
    walkers.push({ p, kind, z, nb, xs, lane: walkers.length, w: lq / Math.sqrt(p), h: arcHeight(S * lq), off: Math.max(0, ji) });
  }
  const lastLaneZ = silver ? Z_LANE0 - 6 * DZ - (silver - 1) * DZS : Z_LANE0 - 5 * DZ;
  const rainZ0 = lastLaneZ - 0.9;
  const rainDepth = Math.min(6, Math.max(2, 1.4 + 0.012 * rain));
  let ri = 0;
  for (const wk of walkers) {
    if (wk.kind !== 'rain') continue;
    wk.z = rainZ0 - rainDepth * (ri + 0.5) / rain + (hash01(wk.p) - 0.5) * 0.6 * rainDepth / rain;
    wk.off = hash01(wk.p * 1.37) * wk.nb;
    ri++;
  }
  const zBackWall = (rain ? rainZ0 - rainDepth : lastLaneZ) - 1.3;
  return { c, L, xEnd, walkers, zBackWall, rain, silver, lastLaneZ };
}

// ---------------------------------------------------------------------------------------------
// The look: a quiet gallery at night, with charcoal-indigo walls, amber pools of light and jewel-tone
// primes on a satin floor. The six jewel hues stay apart for all 15 pairs, since lanes cross on screen:
// worst OKLab Delta E x100 under Machado protan and deutan simulation is 11.4 (tritan 11.5). Silver sits
// at the floor of 6 beside the aquamarine of 2; lanes and numbers tell them apart.
// ---------------------------------------------------------------------------------------------
const LOOK = {
  colors: { p2: '#18c6a8', p3: '#caa1fe', p5: '#e5a323', p7: '#0188ed', p11: '#b43f96', p13: '#618214',
    silver: '#9c978f', springs: '#e9e1d2', crack: '#ff4a3d', wall: '#1d1e33', floor: '#1f1b22' },
  tick: '#cbbba7', bg: '#0b0c14', sky: '#6c78bf', ground: '#120f16', hemi: 0.5,
  grade: { exposure: 1.0, bloom: 1.92, gloss: 0.62, warmth: 2650, fog: 0.35, grain: 0.3, dof: 0.2 },
  pendant: 70, sconce: 26, threadBase: 1.0, threadActive: 4.5, footBase: 1.2, footRing: 2.4,
  orbGlow: 3.4, beadGlow: 1.5, reflect: 0.38, labelMix: 0.45,
};

function kelvin(K) {
  const t = K / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
    b = 255;
  }
  const f = (v) => Math.min(255, Math.max(0, v)) / 255;
  return new THREE.Color().setRGB(f(r), f(g), f(b), THREE.SRGBColorSpace);
}

// ---------------------------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------------------------
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = {
  c: 200, bend: false, bendA: 0.4, xray: false,
  motion: !reducedMotion, cam: (window.innerWidth < window.innerHeight * 0.85) ? 'corridor' : 'hero',
};
const look = () => LOOK;
const cur = () => LOOK;

// ---------------------------------------------------------------------------------------------
// Renderer and post-processing
// ---------------------------------------------------------------------------------------------
const canvas = $('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  fail('This page needs WebGL to draw the hallway, and this browser did not provide it.');
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.01);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 400);

// Only the scene render is multisampled. RenderPass writes renderTarget2 every frame because the
// passes after it swap an even number of times (tilt H and V together, finish, output).
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType }));
composer.renderTarget2.samples = 4;
composer.addPass(new RenderPass(scene, camera));

// Glow is selective: a second render keeps only what is active (thread heads, landing rings, walker
// orbs, the crack) and blooms that, so lights and floor highlights never glow. Its strength is linear.
const bloomRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), 1.9, 0.55, 0);

const TiltShift = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uAmount: { value: 0 },
    uFocus: { value: 0.46 }, uRes: { value: new THREE.Vector2(1, 1) } },

    sub: 'On this ruler, doubling always takes the same length of floor: 1 to 2, 2 to 4 and 4 to 8 are equally far apart.',
    cam: 'floor', lanes: 1, powerLabels: 1 },
  { text: 'Every prime number moves along it in its own stride: 2 lands on 2, 4, 8, 16\u2026; 3 lands on 3, 9, 27\u2026.',
    sub: 'Every footprint is a power of a prime. The bigger the prime, the longer its stride, so big primes cross in a single step.',
    cam: 'hero', lanes: [[0, 1], [2.5, 2], [5.5, Infinity]], powerLabels: 2 },
  { text: 'Each footstep pulls the floor down a little, and a smooth force lifts it.',
    sub: 'The first steps of the small primes press hardest. The lift comes from the smooth part of the formula and knows nothing about individual primes.',
    cam: 'hero', lanes: Infinity, live: 'pull', press: true },
  { text: 'Under the floor sit springs, one for each zeta zero. As the far wall moves out, each bounces at its own rate.',
    sub: 'The far wall steps from 16 out to 64 and back, and every spring answers. How far a spring pushes depends only on where the far wall stands; its zero\u2019s height, 14.13, 21.02, 25.01, \u2026, sets how fast it bounces. There are infinitely many; the first 12 are shown.',
    cam: 'side', lanes: Infinity, xray: true, grow: true },
  { text: 'The Riemann Hypothesis says every spring stays steady, so the floor never cracks.',
    sub: 'Riemann\u2019s explicit formula says the lift minus the footsteps equals the springs\u2019 total push, exactly, at every length. No spring sinks below its rest line, so the total never goes negative. This was proved via Lean 4 in November 2026.',
    cam: 'side', lanes: Infinity, xray: true, grow: true, rest: true, live: 'formula', next: 'What if a zero left the line?' },
  { text: 'If one zero left the line, a twin would come with it, and together they would pull the floor until it cracks.',
    sub: 'The red pair sinks below the rest line. Only a what-\u2060if: the actual zeros all sit on the line, so the real floor holds.',
    // The what-if holds the far wall at 323, where the bent total is lowest between 20 and 400.
    cam: 'side', lanes: Infinity, xray: true, bend: true, rest: true, live: 'whatif', c: 323 },
  { text: 'Each prime on its own is simple: its trip has one of only two lengths, and its string rings with exactly known notes.',
    sub: 'The miracle is how they all fit together.',
    cam: 'hero', lanes: Infinity, live: 'pluck', links: true, next: 'Start over' },
];
// The last step's live line asks for a pluck until there is one, so the card keeps its height when it answers.
const PLUCK_PROMPT = 'Tap a string, or its number below, to pluck it.';
const LINKS = ' <a href="https://alpo.ge/remark.pdf" target="_blank" rel="noopener">The proof note</a> \u00b7 '
  + '<a href="https://math.mit.edu/~drew/grh/" target="_blank" rel="noopener">the computer check</a> \u00b7 '
  + '<a href="https://github.com/j-white/cvs-lean" target="_blank" rel="noopener">this project\u2019s Lean code</a>.';
const story = { i: 0, t: 0, grow: false, wallT0: null, stepT: 0, stepI: 0, ease: null };
let powerLabelLanes = 0;
$('story-dots').replaceChildren(...STORY.map(() => document.createElement('span')));

function setHallway(c) {
  if (c === state.c) return;
  state.c = c;
  schedule('rebuild');
}
// Between steps the hallway's length eases there (in log c) over 0.8 s instead of jumping; reduced
// motion jumps.
function easeHallway(c) {
  story.ease = null;
  if (reducedMotion || !model || c === state.c) setHallway(c);
  else story.ease = { from: Math.log(state.c), to: Math.log(c), c, u: 0 };
}
function easeStep(dt) {
  const e = story.ease;
  e.u = Math.min(1, e.u + dt / 0.8);
  const s = e.u * e.u * (3 - 2 * e.u);
  setHallway(e.u < 1 ? Math.exp(e.from + (e.to - e.from) * s) : e.c);
  if (e.u === 1) story.ease = null;
}
// While the springs are on show with the wall free (story.grow), the far wall moves by its clock. The
// clock is set once the hallway has eased to the wall's start, three whole beats ahead, so the wall
// holds at 16 for 3 to 4 beats while the camera settles; it then runs on from step to step until a
// step without it. Reduced motion steps through WALL_STOPS instead, 1.6 s each by the wall clock (a
// slow frame never stretches a stop).
function wallStep() {
  if (reducedMotion) {
    const now = performance.now();
    if (!story.stepT) story.stepT = now;
    if (now - story.stepT < 1600) return;
    story.stepT = now;
    const n = WALL_STOPS.length;
    story.stepI = (story.stepI + 1) % (2 * n - 2);
    setHallway(wallAt(WALL_STOPS[story.stepI < n ? story.stepI : 2 * n - 2 - story.stepI]));
    return;
  }
  if (story.wallT0 == null) story.wallT0 = Math.ceil(clock / BEAT) + 3;
  setHallway(Math.exp(wallL(Math.max(0, clock / BEAT - story.wallT0))));
}
const wallRunning = () => story.grow && !story.ease && !reducedMotion && story.wallT0 != null && clock / BEAT >= story.wallT0;
// The far wall's whole number: the largest one inside the hallway, so the largest whose footprint can be
// in the sum. On the way out that is the number the wall last passed; on the way back, the one it is
// moving to, since the footprint beyond it has already left the floor.
const wallN = (c) => Math.floor(c + 1e-6);
function lanesGoal(b) {
  const all = model ? model.walkers.length : 0;
  if (!Array.isArray(b.lanes)) return Math.min(b.lanes, all);
  let goal = 0;
  for (const [t, n] of b.lanes) if (story.t >= t) goal = n;
  return Math.min(goal, all);
}

function applyBeat(i) {
  // Focus never falls to the page when the control it sits on goes away (Back disabled, a link
  // rewritten, the pluck row hidden): it moves to Next.
  const had = document.activeElement, inCard = $('story').contains(had);
  story.i = Math.max(0, Math.min(STORY.length - 1, i));
  story.t = 0;
  const b = STORY[story.i];
  $('story-step').textContent = `Step ${story.i + 1} of ${STORY.length}`;
  $('story-text').textContent = b.text;
  if (b.links) $('story-sub').innerHTML = b.sub + LINKS; else $('story-sub').textContent = b.sub;
  $('story-live').hidden = !b.live;
  if (b.live === 'pluck') $('story-live').textContent = PLUCK_PROMPT;
  $('story-plucks').hidden = b.live !== 'pluck';
  $('story-back').disabled = story.i === 0;
  if (inCard && (!had.isConnected || had.closest('[hidden]') || had.disabled)) $('story-next').focus();
  $('story-next').textContent = b.next || 'Next';
  [...$('story-dots').children].forEach((d, j) => d.classList.toggle('on', j === story.i));
  if (state.xray !== !!b.xray) setXray(!!b.xray);
  if (state.bend !== !!b.bend) setBend(!!b.bend);
  footstepPress = !!b.press;
  // Arriving from a step that holds its length, the hallway eases to the wall's start and the wall's
  // clock is set afresh (wallStep); between two steps that share the clock it runs on.
  const wasGrow = story.grow;
  story.grow = !!b.grow;
  if (!story.grow) easeHallway(b.c || 200);
  else if (!wasGrow) { story.wallT0 = null; story.stepT = 0; story.stepI = 0; easeHallway(wallAt(WALL.lo)); }
  schedule('energy');
  powerLabelLanes = b.powerLabels || 0;
  // Hiding is immediate; arriving walkers fade in, one lane after another.
  const goal = lanesGoal(b);
  if (goal < U.uLanes.value) U.uLanes.value = goal;
  applyLaneVisibility();
  state.cam = b.cam;
  // The live line is filled before the card is measured, so the camera frames the card's real height.
  holdLiveHeight();
  liveN = 0;
  updateStoryLive();
  measureCard();
  freshLabels();
  if (model) fitCamera(false);
}
// The live line for a far wall at the whole number N. Its figures are worked out with the wall resting
// there, so each line is a true statement. The lift and the total are rounded to cents and the footsteps
// take up the difference, so the shown subtraction is exact.
function liveText(b, N) {
  const L = Math.log(wallAt(N)), pa = boxParts(L), cents = (v) => (v < 0 ? '\u2212' : '') + (Math.abs(v) / 100).toFixed(2);
  const lift = Math.round(pa.lift * 100);
  if (b.live === 'whatif') {
    // The bent total is not lift minus footsteps, so no subtraction is shown here.
    const en = boxEnergy(L, state.bendA);
    return `Far wall at ${N}: the springs\u2019 total push would be ${cents(Math.round(en * 100))}. The floor would ${en < 0 ? 'crack' : 'hold'}.`;
  }
  const g = Math.round((pa.lift - pa.steps) * 100);
  if (b.live === 'pull') return `Far wall at ${N}: the footsteps pull ${cents(lift - g)} and the smooth force lifts ${cents(lift)}.`;
  return `Far wall at ${N}: lift ${cents(lift)} \u2212 footsteps ${cents(lift - g)} = ${cents(g)}. The floor holds.`;
}
// The live line on show speaks of the far wall's whole number (wallN) and is rewritten only when that
// number changes. While the hallway eases to a new length it speaks of the length it is easing to, so it
// is written once and never races through the numbers in between.
let liveN = 0;
function updateStoryLive() {
  const b = STORY[story.i];
  if (!b.live || b.live === 'pluck') return;
  const N = wallN(story.ease ? story.ease.c : state.c);
  if (N === liveN) return;
  liveN = N;
  $('story-live').textContent = liveText(b, N);
}
// The live line keeps one height while the hallway moves, so the card, and the frame above it, hold
// still: that of its text at the step's own length (the far end, 64, where the far wall moves); in the
// last step, the taller of the prompt and the longest answer, whichever it shows.
function holdLiveHeight() {
  const b = STORY[story.i], el = $('story-live');
  el.style.minHeight = '';
  if (!b.live) return;
  const shown = el.textContent;
  if (b.live === 'pluck') {
    el.textContent = 'Plucked the 13 string: 9 beads, vibration shape 9 of 9.';
    const h = el.offsetHeight;
    el.textContent = PLUCK_PROMPT;
    el.style.minHeight = Math.max(h, el.offsetHeight) + 'px';
  } else {
    el.textContent = liveText(b, b.grow ? WALL.hi : b.c || 200);
    el.style.minHeight = el.offsetHeight + 'px';
  }
  el.textContent = shown;
}
function storyFrame(dt) {
  story.t += dt;
  if (story.ease) easeStep(dt);
  else if (story.grow) wallStep();
  const goal = lanesGoal(STORY[story.i]), v = U.uLanes.value;
  if (Math.abs(goal - v) > 1e-3) {
    // Arriving walkers fade in one lane after another: half a second for each small prime, then the rain.
    const rate = v < JEWEL.length ? 2 : 24;
    U.uLanes.value = reducedMotion || goal < v ? goal : Math.min(goal, v + rate * dt);
    applyLaneVisibility();
  }
}
// On the last step Next reads "Start over" and returns to step 1.
$('story-next').addEventListener('click', () => applyBeat(story.i < STORY.length - 1 ? story.i + 1 : 0));
$('story-back').addEventListener('click', () => applyBeat(story.i - 1));
// Arrow keys step the story once the hallway is drawn, and stop at its two ends; with a modifier they
// are left to the browser (Alt+Left is Back).
document.addEventListener('keydown', (e) => {
  if (!model || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); if (story.i < STORY.length - 1) applyBeat(story.i + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (story.i > 0) applyBeat(story.i - 1); }
});

// The card takes SH px at the bottom at every width. The steps that share the far wall's clock share one
// frame as well: each takes the band of the tallest of their cards, so the picture holds still from one
// to the next.
let SH = 0;
function measureCard() {
  SH = Math.max(0, H - $('story').getBoundingClientRect().top + 8) + (STORY[story.i].grow ? growCardRise() : 0);
  measureUi();
}
// How much taller the tallest card of the far wall's steps is than the card on show, measured on a
// hidden copy of the card.
function growCardRise() {
  const card = $('story'), copy = card.cloneNode(true), part = (cls) => copy.querySelector(cls);
  copy.removeAttribute('id');
  for (const el of copy.querySelectorAll('[id]')) el.removeAttribute('id');
  copy.setAttribute('aria-hidden', 'true');
  copy.style.visibility = 'hidden';
  card.after(copy);
  let tallest = 0;
  for (const b of STORY) {
    if (!b.grow) continue;
    part('.story-text').textContent = b.text;
    part('.story-sub').textContent = b.sub;
    const live = part('.story-live');
    live.hidden = !b.live;
    live.style.minHeight = '';
    if (b.live) live.textContent = liveText(b, WALL.hi);
    part('.btn.primary').textContent = b.next || 'Next';
    tallest = Math.max(tallest, copy.getBoundingClientRect().height);
  }
  copy.remove();
  return Math.max(0, tallest - card.getBoundingClientRect().height);
}
// The card changes height with its text (a live line, a pluck, a rewrap), and the camera reframes with it.
if (window.ResizeObserver) new ResizeObserver(() => { measureCard(); if (model) fitCamera(false); }).observe($('story'));

// ---------------------------------------------------------------------------------------------
// Size and loop
// ---------------------------------------------------------------------------------------------
let W = 1, H = 1;
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  const pr = Math.min(window.devicePixelRatio || 1, W < 760 ? 1.5 : 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(W, H, false);
  // At two device pixels per CSS pixel the scene needs no multisampling.
  const samples = pr >= 2 ? 0 : 4;
  if (composer.renderTarget2.samples !== samples) { composer.renderTarget2.samples = samples; composer.renderTarget2.dispose(); }
  composer.setPixelRatio(pr);
  composer.setSize(W, H);
  WALL_TAG.px = parseFloat(getComputedStyle(wallTag).fontSize) || WALL_TAG.px;
  wallTagW = 0;
  holdLiveHeight();
  measureCard();
  const rw = Math.round(W * pr), rh = Math.round(H * pr);
  bloomRT.setSize(rw, rh);
  bloomPass.setSize(rw, rh);
  tiltH.uniforms.uRes.value.set(rw, rh);
  tiltV.uniforms.uRes.value.set(rw, rh);
  finishPass.uniforms.uRes.value.set(rw, rh);
  if (model) fitCamera(true);
}

// The glow render: everything that is not active is hidden, the backdrop and haze go black, and the
// result is bloomed.
const BLACK = new THREE.Color(0x000000), keepFog = new THREE.Color();
function renderBloom(dt) {
  const hide = [mirror, springs, backWall, farWall, beads, ...sconceGlows, ...labelObjs];
  const shown = hide.map((o) => o.visible);
  for (const o of hide) o.visible = false;
  const bg = scene.background;
  scene.background = BLACK;
  keepFog.copy(scene.fog.color);
  scene.fog.color.copy(BLACK);
  U.uBloom.value = 1;
  renderer.setRenderTarget(bloomRT);
  renderer.render(scene, camera);
  bloomPass.render(renderer, null, bloomRT, dt, false);
  U.uBloom.value = 0;
  scene.fog.color.copy(keepFog);
  scene.background = bg;
  hide.forEach((o, i) => { o.visible = shown[i]; });
  renderer.setRenderTarget(null);
}
window.addEventListener('resize', resize);

let clock = 2.35 * BEAT, last = performance.now(), realTime = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  realTime += dt;
  // The beat comes first, so the far wall, the walkers and the springs all read the same instant.
  if (state.motion) clock += dt;
  storyFrame(dt);
  flush();
  U.uTime.value = clock;
  U.uMotion.value = 1;
  floorU.uClock.value = reducedMotion ? 0 : realTime;
  updateWalkers(clock / BEAT);
  updatePluck(dt);
  updateDent(dt);
  updateLandings(dt);
  updateCrack(dt);
  updateXrayDim(dt);
  updateCamera(dt);
  updateSprings(dt);
  updateWallTag(dt);
  updateLabels(dt);
  if (bloomPass.strength > 0.005) renderBloom(dt);
  composer.render(dt);
  for (const x of disposeLater.splice(0)) x.dispose();
  requestAnimationFrame(frame);
}

async function start() {
  try {
    await Promise.race([
      Promise.all([document.fonts.load('500 64px "IBM Plex Mono"'), document.fonts.load('italic 500 40px "Bodoni Moda"')]),
      new Promise((r) => setTimeout(r, 2500)),
    ]);
  } catch (_) { /* fall back to system faces */ }
  makeSpringLabels();
  resize();
  syncPluckDots();
  applyMaterials();
  rebuild();
  applyBeat(0);
  $('story-next').disabled = false;
  flush();
  fitCamera(true);
  crackShown = crackTarget;
  requestAnimationFrame((t) => { last = t; frame(t); });
}
start();
</script>
</body>
</html>
